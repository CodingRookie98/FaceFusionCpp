# FaceFusionCpp Application Configuration
config_version: "0.34.1"

# --- Inference Infrastructure ---
inference:
  device_id: 0
  engine_cache:
    enable: true
    path: "./.cache/tensorrt"
    max_entries: 3
    idle_timeout_seconds: 60
  default_providers: ["tensorrt", "cuda", "cpu"]

# --- Resource Management ---
resource:
  # Memory Strategy: "strict" (release ASAP) or "tolerant" (keep loaded)
  memory_strategy: "strict"

# --- Logging ---
logging:
  # Level: trace, debug, info, warn, error
  level: "info"
  directory: "./logs"
  rotation: "daily" # daily, hourly, size
  max_files: 7
  max_total_size: "1GB"

# --- Metrics & Observability ---
metrics:
  enable: true
  step_latency: true
  gpu_memory: true
  report_path: "./logs/metrics_{timestamp}.json"
  gpu_sample_interval_ms: 1000

# --- Model Management ---
models:
  path: "./assets/models"
  # Download Strategy: "auto", "force", "skip"
  download_strategy: "auto"

# --- Default Models ---
default_models:
  face_detector: "yoloface"
  face_recognizer: "arcface_w600k_r50"
  face_swapper: "inswapper_128_fp16"
  face_enhancer: "gfpgan_1.4"
  frame_enhancer: "real_esrgan_x2_fp16"

# --- System ---
temp_directory: "./temp"

# --- Default Task Settings (Optional) ---
# 若 Task Config 中未显式指定，则回退使用此处的默认值。
# 优先级: Task Config 显式值 > 此处默认值 > 代码硬编码默认值。
# 字段名与 task_config.yaml 完全一致；仅在此显式定义的字段参与合并。
default_task_settings:
  io:
    output:
      video_encoder: "libx264"
      video_quality: 80
      prefix: "result_"
      suffix: ""
      image_format: "png"
      conflict_policy: "error" # overwrite, rename, error
      audio_policy: "copy"     # copy, skip
  resource:
    thread_count: 0      # 0 = auto (half of CPU cores)
    max_queue_size: 20
    execution_order: "sequential" # sequential, batch
  face_analysis:
    face_detector:
      score_threshold: 0.5
    face_recognizer:
      similarity_threshold: 0.6
